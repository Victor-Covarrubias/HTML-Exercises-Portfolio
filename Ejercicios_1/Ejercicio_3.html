<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Etiquetas HTML
        </title>
        <meta charset="utf-8" />
        <meta name="author" content="Victor Alfonso Covarrubias Solis" />
        <meta name="description" content="Etiquetas multimedia" />
        <meta name="Keywords" content="HTML, tags, audio, source, video, track"/>

    <body>
        <main>
            <h1>Main</h1>
            <section>
                <h2>Audio></h2>
                <h3>Ogg</h3>
                <audio controls>
                    <source src="Media/horse.ogv" type="audio/ogg">
                    El navegador no soporta "Audio".
                </audio>
                <h3>Mp3</h3>
                <audio controls>
                    <source src="Media/horse.mp3" type="audio/mpeg">
                    El navegador no soporta "Audio".
                </audio>
                <h3>Ogg & Mp3</h3>
                <!-- Ejemplo de una etiqueta no reconocida por el navegador "audio" -->
                <audio controls>
                    <source src="Media/horse.ogv" type="audio/ogg">
                    <source src="Media/horse.mp3" type="audio/mpeg">
                    El navegador no soporta "Audio".
                </audio>
            </section>
            <section>
                <h2>Video</h2>
                <video controls>
                    <source src="Media/movie.ogv" type="video/ogg">
                    <source src="Media/movie.mp4" type="video/mp4">
                    El navegador no soporta el uso de la etiqueta "Video"
                </video>
            </section>
            <section>
                <h2>Video con sub&iacute;tulos</h2>
                <video controls>
                    <source src="Media/friday.mp4" type="video/mp4">
                    <track default src="Media/friday.vtt" kind="captions">
                    El navegador no soporta el uso de la etiqueta "Video"
                </video>
            </section>
        </main>
    </body>
