<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Etiquetas HTML
        </title>
        <meta charset="utf-8" />
        <meta name="author" content="Victor Alfonso Covarrubias Solis" />
        <meta name="description" content="Javascript- Document Object Model" />
        <meta name="Keywords" content="HTML, tags, script"/>
        <meta name="generator" content="Visual Studio Code" />
        <meta name="revised" content="Miercoles, 18 de Mayo 2022" />
    </head>
    <body>
        <main>
            <h1>JavaScript</h1>
            <hgroup>
                <h3>Ejemplo No.1</h3>
                <p id="ejemplo_1"></p>
            </hgroup>
            <hgroup>
                <h3>Ejemplo No.2</h3>
                <form id="myForm">
                    Nombre: <input type="text" name="firstName" value="Universidad Politecnica">
                    <br>
                    Apellido: <input type="text" name="lastName" value="de San Luis Potosi">
                    <br><br>
                    <input type="submit" value="Submit"><input type="reset" value="Reset">
                </form>
                <button onclick="myFuncion()">Acci&oacute;n</button>
                <p id="ejemplo_2"></p>
            </hgroup>
            <hgroup>
                <h3>Ejemplo No.3</h3>
                <form id="myForm3">
                    Cadena de muestra:
                    <input type="text" name="txtCadena">
                    <input type="button" name="btnRead" value="Read" onclick="readText()">
                    <input type="button"name="btnWrite" value="Write" onclick="writeTextText()">
                </form>
                <form id="myForm3_1">
                    Comentarios al respecto:<br>
                    <textarea name="myArea" cols="48" rows="5">Hola a todos...</textarea>
                    <br>
                    <input type="button" value="Prueba" onclick="textArea()">
                </form>
            </hgroup>
            <hgroup>
                <h3>Ejemplo No.4</h3>
                <form id="myForm4">
                    <input type="radio" name="opcionRadio">Opci&oacute;n No.1<br>
                    <input type="radio" name="opcionRadio">Opci&oacute;n No.2<br>
                    <input type="radio" name="opcionRadio">Opci&oacute;n No.3<br>
                    <input type="radio" name="opcionRadio">Opci&oacute;n No.4<br>
                    <input type="radio" name="opcionRadio">Opci&oacute;n No.5<br>
                    <input type="button" value="Prueba" onclick="testRadio()">
                </form>
                <br>
                <form id="myForm4_1">
                    <select name="lstOpciones">
                        <option>--- Selecciona ---</option>
                        <option>Alternativa No.1</option>
                        <option>Alternativa No.2</option>
                        <option>Alternativa No.3</option>
                        <option>Alternativa No.4</option>
                        <option>Alternativa No.5</option>
                    </select>
                    <br>
                    <input type="button" value="Prueba" onclick="testSelect()">
                </form>
                <br>
                <form id="myForm4_2">
                    <input type="checkbox" name="CheckBox1" value="CheckBox 1">Opci&oacute;n No.1<br>
                    <input type="checkbox" name="CheckBox2" value="CheckBox 2">Opci&oacute;n No.2<br>
                    <input type="checkbox" name="CheckBox3" value="CheckBox 3">Opci&oacute;n No.3<br>
                    <input type="checkbox" name="CheckBox4" value="CheckBox 4">Opci&oacute;n No.4<br>
                    <input type="checkbox" name="CheckBox5" value="CheckBox 5">Opci&oacute;n No.5<br>
                    <input type="button" value="Prueba" onclick="testCheck()">
                </form>
            </hgroup>
        </main>
        <script>
            //var x, y, z; /* Tipo de definicion global*/
            let x, y, z;   /* Tipo de definicion formal*/
            x = 5;
            y = 6;
            z = x + y;
            document.getElementById("ejemplo_1").innerHTML = "El valor de z es: " + z;

            function myFuncion(){
                var x = document.getElementById("myForm");
                var text ="";
                var i;
                for (i=0; i<x.length;i++){
                    text += x.elements[i].value + "<br>";
                }
                document.getElementById("ejemplo_2").innerHTML = text;
            }

            function readText(){
                var frm = document.getElementById('myForm3');
                var text = frm.txtCadena.value;
                alert('Escribe: ' + text);
            }

            function writeText(){
                var frm = document.getElementById('myForm3');
                frm.txtCadena.value = 'Hola mundo!!!';
            }

            function textArea(){
                var frm = document.getElementById('myForm3_1');
                var test = frm.myArea.value;
                alert('Comentarios: \n' + test);
            }

            function testRadio(){
                var frm = document.getElementById('myForm4');
                for(i = 0; i < 5; i++){
                    if (frm.opcionRadio[i].checked)
                        break;
                }
                alert('La alternativa: ' + (i+1) + ' esta seleccionada...');
            }

            function testSelect(){
                var frm = document.getElementById('myForm4_1');
                var index = frm.lstOpciones.selectedIndex;
                if(index==0)
                    cadena = 'No seleccionaste una alternativa...';
                else
                    cadena = 'Seleccionaste la alternativa No. ' + index;
                alert(cadena);
            }

            function testCheck(){
                var frm = document.getElementById('myForm4_2');
                var txtResult = 'Lista de opciones: \n';
                if(frm.CheckBox1.checked)
                    txtResult += ' - ' + frm.CheckBox1.value + '\n';
                if(frm.CheckBox2.checked)
                    txtResult += ' - ' + frm.CheckBox2.value + '\n';
                if(frm.CheckBox3.checked)
                    txtResult += ' - ' + frm.CheckBox3.value + '\n';
                if(frm.CheckBox4.checked)
                    txtResult += ' - ' + frm.CheckBox4.value + '\n';
                if(frm.CheckBox5.checked)
                    txtResult += ' - ' + frm.CheckBox5.value + '\n';
                alert(txtResult);
            }
        </script>
    </body>
</html>
