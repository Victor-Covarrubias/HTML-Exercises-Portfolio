<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Etiquetas HTML
        </title>
        <meta charset="utf-8" />
        <meta name="author" content="Victor Alfonso Covarrubias Solis" />
        <meta name="description" content="Etiquetas para mapas" />
        <meta name="Keywords" content="HTML, tags, img, map, area"/>
        <meta name="generator" content="Visual Studio Code" />
        <meta name="revised" content="Viernes, 29 de Abril 2022" />
    </head>
    <body>
        <main>
            <section>
                <h2>Mapas</h2>
                <h3>Puedes dar click sobre algunos personajes</h3>
                <img src="Media/galeria-de-heroes-overwatch.jpg" alt="Overwatch" usemap="#workmap">
                <!--Definicion de las secciones del mapa-->
                <map name="workmap">
                    <area shape="rect" coords="316,288,373,355" alt="Moira" href="https://playoverwatch.com/es-es/heroes/moira/" target="_blank">
                    <area shape="circle" coords="347,211,32" alt="Bastion" href="https://playoverwatch.com/es-es/heroes/bastion/" target="_blank">
                    <area shape="poly" coords="236,400,313,400,294,469,217,469" alt="Symmetra" href="https://playoverwatch.com/es-es/heroes/symmetra/" target="_blank">
                </map>
            </section>
        </main>
    </body>
</html>
