<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Etiquetas HTML
        </title>
        <meta charset="utf-8" />
        <meta name="author" content="Victor Alfonso Covarrubias Solis" />
        <meta name="description" content="Javascript- Document Object Model" />
        <meta name="Keywords" content="HTML, tags, script"/>
        <meta name="generator" content="Visual Studio Code" />
        <meta name="revised" content="Martes, 17 de Mayo 2022" />
        <script>
            function muestraInformacion(objEvento) {
                var evento = objEvento || window.event;
                var mensaje = "Tipo de evento: " + evento.type + "<br>";
                mensaje += "Key code: " + evento.keyCode + "<br>";;
                mensaje += "Char code: " + String.fromCharCode(evento.charCode) + "<br>";;

                keyboard.innerHTML += "-----------------------------<br>" + mensaje;
                keyboard.style.backgroundColor = 'black';
                keyboard.style.color = 'greenyellow';
            }
            function cargaInformacion(objEvento){
                var evento = objEvento || window.event;
                var puntoX = evento.clientX;
                var puntoY = evento.clientY;
                var mensaje = "Coordenadas cliente: (" + puntoX + ", " + puntoY + ")<br>";
                puntoX = evento.screenX;
                puntoY = evento.screenY;
                mensaje += "Coordenadas pantalla: (" + puntoX + ", " + puntoY + ")<br>";
                mouse.innerHTML += "-----------------------------<br>" + mensaje;
                mouse.style.backgroundColor = 'black';
                mouse.style.color = 'lightblue';
            }

            window.onload = function(){
                document.onkeypress =muestraInformacion;
                document.onkeydown = muestraInformacion;
                document.onkeyup = muestraInformacion;

                document.onclick = cargaInformacion;
            }
        </script>
    </head>
    <body>
        <main>
            <h1>Document Object Model</h1>
            <h2>Se registra cuando haces click con el teclado o con el raton</h2>
            <hgroup>
                <h2>Teclado</h2>
                <div id="keyboard"></div>
            </hgroup>
            <hgroup>
                <h2>Rat&oacute;n</h2>
                <div id="mouse"></div>
            </hgroup>
        </main>
    </body>
</html>
